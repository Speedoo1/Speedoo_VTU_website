
{% extends 'index/navbar.html'%}
{%block airtime%}class="navbars-nav"{%endblock%}
{%block data%}class="navbars-nav"{%endblock%}
{% block body%}
          <div class="container  airtime-color shadow">

            <form action="{% url 'index:create'%}" autocomplete="off" method="post">
              {% csrf_token %}
              <div class="container">




                <h3 class="buy">Create an Account</h3><br>


                <hr><br>
                  {% for message in messages%}

                   <div class="alert {{message.tags}} alert-dismissible" role="alert">
                     <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                       <span aria-hidden="True">&times;</span>
                     </button>
                     &nbsp;{{message}}

                 </div>
                  {%endfor%}

                <label ><b>Username:</b></label>
                <input type="text" autocomplete="off" placeholder="Enter your Username" name="username" id="username"  required>

                <label ><b>Email:</b></label>
                <input type="email" autocomplete="off" placeholder="Enter your Email Address" name="email" id="email"  required>
                   <label ><b>Phone Number:</b></label>
                <input type="tel" autocomplete="off" placeholder="" name="number" id="phone"  required>
                 <label ><b>Gender:</b></label>
                 <select name="gender" id="e"  style="display: block; margin-top:12px ;" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                 </select><br/>
                <label ><b>Password:</b></label>
                <input type="password" autocomplete="off" placeholder="Enter your Password"  name="password" id="password" required><br/>
                 <label ><b>Confirm Password:</b></label>
                <input type="password" autocomplete="off" placeholder="Enter your secret Password again"  name="confirm_password" id="confirm" required><br/>


                <hr>



                <button type="submit" class="registerbtn">Register</button>
              </div>


            </form><br/>
            <div class="container">
               <p>Already have an account <a href="{% url 'index:loging'%}">Login</a> .</p>

            </div>




          </div>






<script>

</script>
{%endblock%}
