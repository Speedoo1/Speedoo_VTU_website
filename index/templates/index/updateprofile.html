{% extends 'index/navbar.html'%}
{%block airtime%}class="navbars-nav"{%endblock%}
{%block data%}class="navbars-nav"{%endblock%}
{% block body%}
          <div class="container  airtime-color shadow">

            <form action="{% url 'index:updateprofile'%}" autocomplete="off" method="post">
              {% csrf_token %}
              <div class="container">




                <h3 class="buy">PROFILE UPDATE</h3><br>


                <hr><br>
                  {% for message in messages%}

                   <div class="alert {{message.tags}} alert-dismissible" role="alert">
                     <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                       <span aria-hidden="True">&times;</span>
                     </button>
                     &nbsp;{{message}}

                 </div>
                  {%endfor%}
                <label ><b>Username:</b></label>
                <input type="text" autocomplete="off" placeholder="Enter your Username" name="username" id="username"  value="{{profile.username}}" required>

                <label ><b>Email:</b></label>
                <input type="email" autocomplete="off" placeholder="Enter your Email Address" name="email" id="email" value="{{profile.email}}"  required>
                   <label ><b>Phone Number:</b></label>
                <input type="tel" autocomplete="off" placeholder="" name="number" id="phone"  value="{{profile.phone_number}}" required>
                 <label ><b>Gender:</b></label>
                 <select name="gender" id="e" value="{{profile.gender}}"  style="display: block; margin-top:12px ;" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                 </select><br/>


                <hr>



                <button type="submit" class="registerbtn">UPDATE</button>
              </div>


            </form><br/>




          </div>






<script>
   if(window.history.replaceState){
    window.history.replaceState(null,null,window.location.href);
    }
</script>
{%endblock%}
